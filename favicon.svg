<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d124d"/>
      <stop offset="100%" stop-color="#0e071c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="50%" stop-color="#f5c242"/>
      <stop offset="100%" stop-color="#d49419"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffd56b" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f39c12" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e74c3c" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="26" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="24.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <!-- Glow behind flame -->
  <circle cx="50" cy="30" r="18" fill="url(#glow)" filter="url(#blur)"/>
  <!-- Candle -->
  <rect x="47" y="32" width="6" height="22" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/>
  <!-- Flame -->
  <path d="M50 18 C53 23 54 27 50 31 C46 27 47 23 50 18 Z" fill="#ffd54f"/>
  <path d="M50 21 C51.5 24 52 26 50 28 C48 26 48.5 24 50 21 Z" fill="#ff7043"/>
  <!-- Cake Base -->
  <path d="M22 66 C22 58 78 58 78 66 L78 74 C78 81 22 81 22 74 Z" fill="url(#gold)"/>
  <ellipse cx="50" cy="66" rx="28" ry="8" fill="#ffeaa7"/>
  <ellipse cx="50" cy="54" rx="22" ry="7" fill="#ffffff" opacity="0.9"/>
  <!-- Sparkles -->
  <path d="M30 35 Q30 40 25 40 Q30 40 30 45 Q30 40 35 40 Q30 40 30 35 Z" fill="#ffe082"/>
  <path d="M72 42 Q72 46 68 46 Q72 46 72 50 Q72 46 76 46 Q72 46 72 42 Z" fill="#ff80bf"/>
</svg>
